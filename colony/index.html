<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1610">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mini Colony</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game" id="game">
  <canvas class="world" id="world"></canvas>

  <div class="resources" id="resources"></div>
  <div class="colonist-bar" id="colonist-bar"></div>
  <div class="clock" id="clock">วันที่ 1</div>
  <div class="speed" id="speed">
    <button class="btn-speed" data-speed="0" aria-label="หยุด"><img data-icon="pause" alt=""></button>
    <button class="btn-speed" data-speed="1" aria-label="ปกติ"><img data-icon="play" alt=""></button>
    <button class="btn-speed" data-speed="2" aria-label="เร็ว"><img data-icon="fast" alt=""></button>
    <button class="btn-speed" data-speed="3" aria-label="เร็วมาก"><img data-icon="faster" alt=""></button>
  </div>

  <div class="alerts" id="alerts"></div>

  <div class="inspect" id="inspect">
    <div class="inspect-title" id="inspect-title"></div>
    <div class="inspect-body" id="inspect-body"></div>
    <div class="inspect-actions" id="inspect-actions"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="hint-chip" id="hint-chip"><span></span><button class="btn">เลิกใช้</button></div>
  <div class="tutorial" id="tutorial"><div class="tutorial-text"></div><button class="btn">ข้าม</button></div>

  <div class="tab-panel" id="panel-architect" data-tab="architect">
    <div class="panel-title">สถาปนิก — แตะเครื่องมือ แล้วแตะ/ลากบนแผนที่</div>
    <div class="panel-grid" data-group="architect"></div>
  </div>
  <div class="tab-panel" id="panel-work" data-tab="work">
    <div class="panel-title">งาน — แตะช่องเพื่อเปลี่ยนลำดับ (1 = ทำก่อน, ว่าง = ไม่ทำ)</div>
    <table class="work-table" id="work-table"></table>
  </div>
  <div class="tab-panel" id="panel-orders" data-tab="orders">
    <div class="panel-title">คำสั่ง — ลากกรอบบนแผนที่</div>
    <div class="panel-grid" data-group="orders"></div>
  </div>
  <div class="tab-panel" id="panel-zones" data-tab="zones">
    <div class="panel-title">โซน — ลากกรอบบนแผนที่</div>
    <div class="panel-grid" data-group="zones"></div>
  </div>
  <div class="tab-panel" id="panel-info" data-tab="info">
    <div class="panel-title" id="info-title">ข้อมูลอาณานิคม</div>
    <div class="log" id="log"></div>
  </div>
  <div class="tab-panel" id="panel-menu" data-tab="menu">
    <div class="panel-title">เมนู</div>
    <div class="panel-grid">
      <button class="btn" id="btn-full">เต็มจอ</button>
      <button class="btn" id="btn-save">บันทึกเกม</button>
      <button class="btn" id="btn-center">กล้องไปที่อาณานิคม</button>
      <button class="btn" id="btn-tut">คำแนะนำ เปิด/ปิด</button>
      <button class="btn" id="btn-new">เกมใหม่</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" data-tab="architect"><img data-icon="architect" alt=""><span>สถาปนิก</span></button>
    <button class="tab" data-tab="work"><img data-icon="work" alt=""><span>งาน</span></button>
    <button class="tab" data-tab="orders"><img data-icon="orders" alt=""><span>คำสั่ง</span></button>
    <button class="tab" data-tab="zones"><img data-icon="zones" alt=""><span>โซน</span></button>
    <button class="tab" data-tab="info"><img data-icon="info" alt=""><span>ข้อมูล</span></button>
    <button class="tab" data-tab="menu"><img data-icon="menu" alt=""><span>เมนู</span></button>
  </div>

  <div class="letter-overlay" id="letter-overlay">
    <div class="letter">
      <h3 id="letter-title"></h3>
      <p id="letter-body"></p>
      <div class="letter-actions">
        <button class="btn" id="letter-go">ไปดู</button>
        <button class="btn" id="letter-ok">รับทราบ</button>
      </div>
    </div>
  </div>

  <div class="rotate-hint">กรุณาหมุนจอเป็นแนวนอน</div>
</div>

<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
