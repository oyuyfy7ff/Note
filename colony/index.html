<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2420">
<title>Mini Colony</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="stat" title="วัน"><img class="stat-icon" data-icon="day" alt="วัน"><span class="stat-value" id="v-day">1</span></div>
    <div class="stat" title="อาหาร"><img class="stat-icon" data-icon="food" alt="อาหาร"><span class="stat-value" id="v-food">0</span></div>
    <div class="stat" title="ไม้"><img class="stat-icon" data-icon="wood" alt="ไม้"><span class="stat-value" id="v-wood">0</span></div>
    <div class="stat" title="หิน"><img class="stat-icon" data-icon="stone" alt="หิน"><span class="stat-value" id="v-stone">0</span></div>
    <div class="stat" title="ประชากร"><img class="stat-icon" data-icon="pop" alt="ประชากร"><span class="stat-value" id="v-pop">0/0</span></div>
    <div class="stat" title="ขวัญกำลังใจ"><img class="stat-icon" data-icon="morale" alt="ขวัญ"><span class="stat-value" id="v-morale">50</span></div>
  </div>
  <div class="morale"><div class="morale-fill" id="morale-fill" data-level="mid" style="width:50%"></div></div>

  <div class="stage">
    <canvas id="board"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="panel-label">ลำดับงาน (แตะเพื่อเลื่อนขึ้นเป็นอันดับแรก)</div>
  <div class="panel" id="prio-panel"></div>

  <div class="panel-label">สร้าง (แตะปุ่ม แล้วแตะช่องบนแผนที่ แตะซ้ำเพื่อวาง)</div>
  <div class="panel" id="build-panel">
    <button class="btn" data-build="hut"><img class="btn-icon" data-icon="hut" alt=""><span class="btn-text">บ้าน</span><span class="btn-cost">ไม้ 10</span></button>
    <button class="btn" data-build="tower"><img class="btn-icon" data-icon="tower" alt=""><span class="btn-text">หอคอย</span><span class="btn-cost">ไม้ 4 หิน 12</span></button>
    <button class="btn" data-build="farm"><img class="btn-icon" data-icon="farm" alt=""><span class="btn-text">ฟาร์ม</span><span class="btn-cost">ไม้ 6</span></button>
  </div>

  <div class="panel" id="speed-panel">
    <button class="btn" data-speed="0" id="btn-pause"><img class="btn-icon" data-icon="pause" alt=""><span class="btn-text">หยุด</span></button>
    <button class="btn" data-speed="1"><img class="btn-icon" data-icon="speed" alt=""><span class="btn-text">x1</span></button>
    <button class="btn" data-speed="2"><img class="btn-icon" data-icon="speed" alt=""><span class="btn-text">x2</span></button>
    <button class="btn" data-speed="3"><img class="btn-icon" data-icon="speed" alt=""><span class="btn-text">x3</span></button>
    <button class="btn" id="btn-new"><span class="btn-text">เกมใหม่</span></button>
  </div>

  <div class="panel-label">บันทึกเหตุการณ์</div>
  <div class="log" id="log"></div>
</div>

<div class="overlay" id="info-overlay">
  <div class="overlay-card">
    <h2 id="info-name">-</h2>
    <div class="info-row"><span>นิสัย</span><span id="info-trait">-</span></div>
    <p id="info-trait-desc"></p>
    <div class="info-row"><span>พลังชีวิต</span><span id="info-hp">-</span></div>
    <div class="info-row"><span>งานตอนนี้</span><span id="info-job">-</span></div>
    <div class="info-row"><span>ถือของ</span><span id="info-carry">-</span></div>
    <button class="btn" id="info-close"><span class="btn-text">ปิด</span></button>
  </div>
</div>

<div class="overlay" id="over-overlay">
  <div class="overlay-card">
    <h2>อาณานิคมล่มสลาย</h2>
    <p id="over-text"></p>
    <button class="btn" id="over-restart"><span class="btn-text">เริ่มใหม่</span></button>
  </div>
</div>

<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
