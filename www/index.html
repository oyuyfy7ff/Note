<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NoteMind</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ios.css">
</head>
<body>
  <section id="view-notes" hidden>
    <header class="appbar large">
      <h1>โน้ต</h1>
      <button type="button" class="txt" id="select">เลือก</button>
    </header>
    <main class="screen">
      <div class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input id="search" type="search" autocomplete="off" placeholder="ค้นหา" aria-label="ค้นหา">
      </div>
      <div id="list"></div>
      <p class="empty" id="empty"></p>
      <p class="count muted small" id="count"></p>
    </main>
    <button type="button" class="fab" id="new" aria-label="โน้ตใหม่">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="M18.5 3.5a2 2 0 0 1 3 3L12 16l-4 1 1-4z"/></svg>
    </button>
  </section>

  <section id="view-ai" hidden>
    <header class="appbar large">
      <h1>AI</h1>
      <button type="button" class="txt" id="chat-clear">ล้าง</button>
    </header>
    <main class="screen">
      <p class="muted small" id="ai-status"></p>
      <div class="chat" id="chat"></div>
      <p class="empty" id="chat-empty">ถามอะไรก็ได้ หรือกดสรุปและวิเคราะห์โน้ตจากปุ่มด้านล่าง</p>
      <p class="error" id="chat-err" hidden></p>
    </main>
    <div class="aibar">
      <div class="toolbar">
        <button type="button" class="soft" id="act-sum">สรุปโน้ต</button>
        <button type="button" class="soft" id="act-ana">วิเคราะห์โน้ต</button>
        <button type="button" class="soft" id="act-find">ค้นหาในโน้ต</button>
      </div>
      <div class="composer">
        <textarea id="chat-input" rows="1" placeholder="พิมพ์ข้อความ" aria-label="ข้อความ"></textarea>
        <button type="button" class="icon-send" id="chat-send" aria-label="ส่ง">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section id="view-settings" hidden>
    <header class="appbar large"><h1>ตั้งค่า</h1></header>
    <main class="screen">
      <p class="muted small">AI (OpenRouter)</p>
      <div class="group">
        <div class="field">
          <label for="apikey">API key</label>
          <input id="apikey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="model">ชื่อโมเดล</label>
          <input id="model" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="provider/model">
        </div>
      </div>
      <button type="button" class="soft block" id="showkey">แสดง key</button>
      <button type="button" class="block" id="save-settings">บันทึก</button>
      <p class="muted small" id="settings-msg"></p>
      <p class="muted small">key เก็บไว้ในเครื่องนี้เท่านั้น ไม่ถูกส่งขึ้น GitHub</p>
      <p class="muted small" id="ver"></p>
      <pre id="err"></pre>
    </main>
  </section>

  <section id="view-edit" hidden>
    <header class="appbar edit">
      <button type="button" class="txt" id="back" aria-label="กลับ">
        <svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>โน้ต</span>
      </button>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="add-img" aria-label="เพิ่มรูป">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg>
      </button>
      <button type="button" class="icon-btn" id="mode" aria-pressed="false" aria-label="เขียนมือ">
        <svg class="i ic-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg>
        <svg class="i ic-kbd" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
      </button>
      <button type="button" class="icon-btn" id="del" aria-label="ลบ">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
      </button>
    </header>
    <div class="page" id="page">
      <div class="paper" id="paper">
        <p class="stamp" id="stamp"></p>
        <input class="page-title" id="title" type="text" autocomplete="off" placeholder="หัวข้อ">
        <div id="images"></div>
        <textarea class="page-body" id="body" placeholder="เริ่มพิมพ์ หรือกดปุ่มปากกาเพื่อเขียนมือ"></textarea>
        <p class="muted small" id="saved"></p>
        <canvas id="pad" width="800" height="1200"></canvas>
      </div>
    </div>
    <div class="dock" id="dock" hidden>
      <button type="button" class="tool" data-tool="pen" aria-pressed="true" aria-label="ปากกา">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg>
      </button>
      <button type="button" class="tool" data-tool="eraser" aria-pressed="false" aria-label="ยางลบ">
        <svg class="i" viewBox="0 0 24 24"><path d="M9 20h11"/><path d="M5 15l8.5-8.5a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/></svg>
      </button>
      <button type="button" class="tool" data-tool="scroll" aria-pressed="false" aria-label="เลื่อนหน้า">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4"/></svg>
      </button>
      <span class="sep"></span>
      <button type="button" class="tool" id="undo" aria-label="ย้อนกลับ">
        <svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button type="button" class="tool" id="redo" aria-label="ทำซ้ำ">
        <svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <span class="sep"></span>
      <button type="button" class="tool swatch" data-color="#111111" aria-label="สีดำ" aria-pressed="true"><span style="background:#111111"></span></button>
      <button type="button" class="tool swatch" data-color="#1d4ed8" aria-label="สีน้ำเงิน" aria-pressed="false"><span style="background:#1d4ed8"></span></button>
      <button type="button" class="tool swatch" data-color="#c62828" aria-label="สีแดง" aria-pressed="false"><span style="background:#c62828"></span></button>
      <button type="button" class="tool swatch" data-color="#2e7d32" aria-label="สีเขียว" aria-pressed="false"><span style="background:#2e7d32"></span></button>
      <span class="sep"></span>
      <button type="button" class="tool size" data-size="3" aria-pressed="false" aria-label="บาง"><span style="width:4px;height:4px"></span></button>
      <button type="button" class="tool size" data-size="6" aria-pressed="true" aria-label="กลาง"><span style="width:9px;height:9px"></span></button>
      <button type="button" class="tool size" data-size="12" aria-pressed="false" aria-label="หนา"><span style="width:15px;height:15px"></span></button>
    </div>
  </section>

  <input type="file" id="file" accept="image/*" multiple hidden>

  <nav class="nav" id="nav" hidden>
    <button type="button" data-tab="notes" aria-current="page">
      <svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>โน้ต</span>
    </button>
    <button type="button" data-tab="ai">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></svg><span>AI</span>
    </button>
    <button type="button" data-tab="settings">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>ตั้งค่า</span>
    </button>
  </nav>

  <div class="selbar" id="selbar" hidden>
    <button type="button" class="txt" id="sel-done">เสร็จ</button>
    <button type="button" class="txt danger-txt" id="sel-delete">ลบที่เลือก</button>
  </div>

  <div class="scrim" id="confirm" hidden>
    <div class="sheet">
      <h2 id="confirm-title"></h2>
      <p class="muted" id="confirm-text"></p>
      <button type="button" class="danger block" id="confirm-yes">ลบ</button>
      <button type="button" class="soft block" id="confirm-no">ยกเลิก</button>
    </div>
  </div>

  <div class="scrim" id="pick" hidden>
    <div class="sheet">
      <h2 id="pick-title"></h2>
      <ul class="group" id="pick-list"></ul>
      <button type="button" class="soft block" id="pick-no">ยกเลิก</button>
    </div>
  </div>

  <script>
    window.addEventListener("error", function (e) {
      document.getElementById("err").textContent += e.message + " (" + e.filename + ":" + e.lineno + ")\n";
    });
    window.addEventListener("unhandledrejection", function (e) {
      document.getElementById("err").textContent += "Promise: " + e.reason + "\n";
    });
  </script>
  <script src="images.js"></script>
  <script src="core.js"></script>
  <script src="ink.js"></script>
  <script src="editor.js"></script>
  <script src="chat.js"></script>
  <script src="app.js"></script>
</body>
</html>
